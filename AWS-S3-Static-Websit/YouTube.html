<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Video Page</title>
    <style>
        /* Internal CSS styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f9f9f9;
        }

        .container {
            width: 80%;
            max-width: 1200px;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .video-player {
            width: 100%;
            height: 500px;
            background-color: #000;
            position: relative;
            margin-bottom: 20px;
        }

        .video-player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-title {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }

        .video-details {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .video-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .video-actions button {
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background-color: #e0e0e0;
            border-radius: 5px;
        }

        .video-actions button:hover {
            background-color: #d3d3d3;
        }

        .comments-section {
            margin-top: 20px;
        }

        .comments-section h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #333;
        }

        .comment {
            display: flex;
            margin-bottom: 10px;
            align-items: flex-start;
        }

        .comment img {
            border-radius: 50%;
            margin-right: 10px;
            width: 40px;
            height: 40px;
        }

        .comment-content {
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
        }

        .comment-content p {
            margin: 0;
        }

        .comment-content .comment-author {
            font-weight: bold;
            color: #333;
        }

        .comment-content .comment-text {
            margin-top: 5px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Video Player Section -->
        <div class="video-player">
            <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe>
        </div>

        <!-- Video Title -->
        <div class="video-title">
            Sample YouTube Video Title
        </div>

        <!-- Video Details and Actions -->
        <div class="video-details">
            <div class="video-info">
                <p>1,234,567 views • Jan 1, 2024</p>
            </div>
            <div class="video-actions">
                <button>👍 Like</button>
                <button>👎 Dislike</button>
                <button>Share</button>
                <button>Save</button>
            </div>
        </div>

        <!-- Comments Section -->
        <div class="comments-section">
            <h3>Comments</h3>
            
            <!-- Example Comment -->
            <div class="comment">
                <img src="https://via.placeholder.com/40" alt="User Profile Picture">
                <div class="comment-content">
                    <p class="comment-author">User1</p>
                    <p class="comment-text">This is a sample comment for the video. Great content!</p>
                </div>
            </div>

            <!-- Another Comment -->
            <div class="comment">
                <img src="https://via.placeholder.com/40" alt="User Profile Picture">
                <div class="comment-content">
                    <p class="comment-author">User2</p>
                    <p class="comment-text">Really enjoyed watching this. Thanks for sharing!</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
